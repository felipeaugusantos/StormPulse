# StormPulse — local development stack (FASE 1).
# Postgres+PostGIS, Redis and the FastAPI API. Workers arrive in FASE 10.

services:
  db:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stormpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stormpulse}
      POSTGRES_DB: ${POSTGRES_DB:-stormpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stormpulse} -d ${POSTGRES_DB:-stormpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Private object store for Caderno de Campo field photos (Fase 6,
  # ADR-0090) — S3-compatible, accessed via boto3 (already a dependency)
  # pointed at this endpoint instead of a separate MinIO SDK. Pulled from
  # quay.io, not Docker Hub — MinIO archived the OSS edition and removed
  # minio/minio from Docker Hub entirely around 2026-09-16; quay.io/minio/
  # minio serves the identical digest under the same tag (verified live).
  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z@sha256:9535594ad4122b7a78c6632788a989b96d9199b483d3bd71a5ceae73a922cdfa
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${FIELDNOTES_STORAGE_ACCESS_KEY:-stormpulse}
      MINIO_ROOT_PASSWORD: ${FIELDNOTES_STORAGE_SECRET_KEY:-dev-insecure-minio-secret-change-me}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Defaults to the smaller image without GDAL/TATHU, matching
      # SATELLITE_ENABLED=false below. Set API_DOCKER_TARGET=runtime-satellite
      # (alongside SATELLITE_ENABLED=true) to build the satellite-capable
      # variant — see backend/Dockerfile and ADR-0032.
      target: ${API_DOCKER_TARGET:-runtime-base}
    # Hardening (env var passthrough audit): every Settings field
    # (app/core/config.py) that has an entry in .env.example is loaded from
    # the project's own .env — `${VAR:-default}` substitution in this file
    # only covers whatever variable someone remembered to enumerate here by
    # hand, which is how TRUSTED_PROXY_IPS, REFRESH_COOKIE_*, OTEL_*,
    # INMET_*/CPTEC_*/OPEN_METEO_*/AGRO_* and SATELLITE_EXTENT silently
    # never reached any container. `env_file` passes the whole file at
    # once; `environment:` below still wins over it for the handful of
    # values that must differ inside the Docker network (service DNS names,
    # not the `localhost` a human uses outside Docker).
    env_file:
      - path: .env
        required: false
    environment: &service_env_overrides
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FIELDNOTES_STORAGE_ENDPOINT: minio:9000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # The satellite pipeline (GDAL/TATHU) runs inside this service — needs
      # the satellite target whenever SATELLITE_ENABLED=true. See the `api`
      # service above for the full explanation.
      target: ${API_DOCKER_TARGET:-runtime-base}
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info"]
    env_file:
      - path: .env
        required: false
    environment: *service_env_overrides
    # The image's own HEALTHCHECK (backend/Dockerfile) curls :8000/health —
    # right for `api`, meaningless here (this container runs Celery, never
    # an HTTP server, so that port never listens and Docker marked this
    # "unhealthy" forever even when genuinely fine — a real incident,
    # 2026-09-22). `inspect ping` round-trips through the broker (Redis)
    # to confirm the worker process is actually alive and responsive.
    healthcheck:
      test: ["CMD", "celery", "-A", "workers.celery_app", "inspect", "ping", "--timeout=10"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Beat only schedules task *names* (workers/celery_app.py never
      # imports workers.tasks), so it never needs GDAL/TATHU — always the
      # small image, regardless of API_DOCKER_TARGET.
      target: runtime-base
    # --schedule points at a writable path (the app dir is owned by root; the
    # container runs as a non-root user).
    command:
      ["celery", "-A", "workers.celery_app", "beat", "--schedule",
       "/tmp/celerybeat-schedule", "--loglevel=info"]
    env_file:
      - path: .env
        required: false
    environment: *service_env_overrides
    # Same story as `worker` above — beat isn't an HTTP server either, the
    # image's baked-in :8000/health check always failed here. Beat has no
    # `inspect ping` equivalent (it schedules, it doesn't consume tasks),
    # so liveness is inferred from its own schedule file being touched
    # recently — celery beat rewrites it every time a due entry's
    # last-run-time changes, which happens at least once a minute given
    # this project's tightest schedule (celery_app.py's
    # deliver-notifications-every-minute/alert-delivery-every-minute).
    # 150s is a generous multiple of that, not a tight deadline.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          test $(($(date +%s) - $(stat -c %Y /tmp/celerybeat-schedule 2>/dev/null || echo 0))) -lt 150
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
