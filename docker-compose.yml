# StormPulse — local development stack (FASE 1).
# Postgres+PostGIS, Redis and the FastAPI API. Workers arrive in FASE 10.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stormpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stormpulse}
      POSTGRES_DB: ${POSTGRES_DB:-stormpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stormpulse} -d ${POSTGRES_DB:-stormpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Defaults to the smaller image without GDAL/TATHU, matching
      # SATELLITE_ENABLED=false below. Set API_DOCKER_TARGET=runtime-satellite
      # (alongside SATELLITE_ENABLED=true) to build the satellite-capable
      # variant — see backend/Dockerfile and ADR-0032.
      target: ${API_DOCKER_TARGET:-runtime-base}
    # Hardening (env var passthrough audit): every Settings field
    # (app/core/config.py) that has an entry in .env.example is loaded from
    # the project's own .env — `${VAR:-default}` substitution in this file
    # only covers whatever variable someone remembered to enumerate here by
    # hand, which is how TRUSTED_PROXY_IPS, REFRESH_COOKIE_*, OTEL_*,
    # INMET_*/CPTEC_*/OPEN_METEO_*/AGRO_* and SATELLITE_EXTENT silently
    # never reached any container. `env_file` passes the whole file at
    # once; `environment:` below still wins over it for the handful of
    # values that must differ inside the Docker network (service DNS names,
    # not the `localhost` a human uses outside Docker).
    env_file:
      - path: .env
        required: false
    environment: &service_env_overrides
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # The satellite pipeline (GDAL/TATHU) runs inside this service — needs
      # the satellite target whenever SATELLITE_ENABLED=true. See the `api`
      # service above for the full explanation.
      target: ${API_DOCKER_TARGET:-runtime-base}
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info"]
    env_file:
      - path: .env
        required: false
    environment: *service_env_overrides
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Beat only schedules task *names* (workers/celery_app.py never
      # imports workers.tasks), so it never needs GDAL/TATHU — always the
      # small image, regardless of API_DOCKER_TARGET.
      target: runtime-base
    # --schedule points at a writable path (the app dir is owned by root; the
    # container runs as a non-root user).
    command:
      ["celery", "-A", "workers.celery_app", "beat", "--schedule",
       "/tmp/celerybeat-schedule", "--loglevel=info"]
    env_file:
      - path: .env
        required: false
    environment: *service_env_overrides
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
