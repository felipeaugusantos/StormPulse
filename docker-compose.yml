# StormPulse — local development stack (FASE 1).
# Postgres+PostGIS, Redis and the FastAPI API. Workers arrive in FASE 10.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stormpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stormpulse}
      POSTGRES_DB: ${POSTGRES_DB:-stormpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stormpulse} -d ${POSTGRES_DB:-stormpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Defaults to the smaller image without GDAL/TATHU, matching
      # SATELLITE_ENABLED=false below. Set API_DOCKER_TARGET=runtime-satellite
      # (alongside SATELLITE_ENABLED=true) to build the satellite-capable
      # variant — see backend/Dockerfile and ADR-0032.
      target: ${API_DOCKER_TARGET:-runtime-base}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-stormpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stormpulse}
      POSTGRES_DB: ${POSTGRES_DB:-stormpulse}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-insecure-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-mock}
      SATELLITE_ENABLED: ${SATELLITE_ENABLED:-false}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contato@stormpulse.example}
      LIGHTNING_ENABLED: ${LIGHTNING_ENABLED:-false}
      REDEMET_API_KEY: ${REDEMET_API_KEY:-}
      REDEMET_BASE_URL: ${REDEMET_BASE_URL:-https://api-redemet.decea.mil.br}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # The satellite pipeline (GDAL/TATHU) runs inside this service — needs
      # the satellite target whenever SATELLITE_ENABLED=true. See the `api`
      # service above for the full explanation.
      target: ${API_DOCKER_TARGET:-runtime-base}
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info"]
    environment: &worker_env
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      # Never actually used for token operations here (workers don't issue
      # or verify JWTs) — but `get_settings()` validates this field
      # unconditionally at import time (`workers/celery_app.py`), and
      # refuses the dev default when ENVIRONMENT=production. Without this,
      # worker/beat crash-loop in any real production deploy — this was
      # missing until a real ENVIRONMENT=production run first exercised it.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-insecure-change-me}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-stormpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stormpulse}
      POSTGRES_DB: ${POSTGRES_DB:-stormpulse}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-mock}
      SATELLITE_ENABLED: ${SATELLITE_ENABLED:-false}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contato@stormpulse.example}
      LIGHTNING_ENABLED: ${LIGHTNING_ENABLED:-false}
      REDEMET_API_KEY: ${REDEMET_API_KEY:-}
      REDEMET_BASE_URL: ${REDEMET_BASE_URL:-https://api-redemet.decea.mil.br}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Beat only schedules task *names* (workers/celery_app.py never
      # imports workers.tasks), so it never needs GDAL/TATHU — always the
      # small image, regardless of API_DOCKER_TARGET.
      target: runtime-base
    # --schedule points at a writable path (the app dir is owned by root; the
    # container runs as a non-root user).
    command:
      ["celery", "-A", "workers.celery_app", "beat", "--schedule",
       "/tmp/celerybeat-schedule", "--loglevel=info"]
    environment: *worker_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
