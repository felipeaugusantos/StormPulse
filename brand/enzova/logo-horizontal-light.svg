  </g>
  <text x="82" y="34" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="26" fill="#F8FAFC" letter-spacing="0.5">ENZOVA</text>
  <text x="83" y="52" font-family="Manrope, Arial, sans-serif" font-weight="700" font-size="11" fill="#36E39F" letter-spacing="2.5">TECH</text>
</svg>
