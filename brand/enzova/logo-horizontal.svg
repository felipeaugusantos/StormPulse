<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 64">
  <!-- Horizontal lockup — icon + wordmark side by side, for headers/navbars
       where vertical space is tight. Same asymmetric ENZOVA/TECH weight
       as the stacked version. -->
  <rect width="64" height="64" rx="14" fill="#081A2B"/>
  <g transform="rotate(-6 32 32)">
    <rect x="15" y="16" width="18" height="8" rx="4" fill="#36E39F"/>
    <rect x="15" y="28" width="27" height="8" rx="4" fill="#36E39F"/>
    <rect x="15" y="40" width="36" height="8" rx="4" fill="#36E39F"/>
  </g>
  <text x="82" y="34" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="26" fill="#081A2B" letter-spacing="0.5">ENZOVA</text>
  <text x="83" y="52" font-family="Manrope, Arial, sans-serif" font-weight="700" font-size="11" fill="#36E39F" letter-spacing="2.5">TECH</text>
</svg>
