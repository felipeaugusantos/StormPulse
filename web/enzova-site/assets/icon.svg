<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Enzova icon — abstract "E" as three geometric bars, increasing in
       length top→bottom, tilted slightly to suggest forward motion /
       evolution (idea → development → product). Deliberately not a
       literal computer/brain/circuit/cloud (see Brand Starter §23). -->
  <rect width="64" height="64" rx="14" fill="#081A2B"/>
  <g transform="rotate(-6 32 32)">
    <rect x="15" y="16" width="18" height="8" rx="4" fill="#36E39F"/>
    <rect x="15" y="28" width="27" height="8" rx="4" fill="#36E39F"/>
    <rect x="15" y="40" width="36" height="8" rx="4" fill="#36E39F"/>
  </g>
</svg>
