# StormPulse web — serves the built SPA and reverse-proxies API calls to
# the `api` service, both on the same origin (infra ADR-0038). Same-origin
# means the browser needs no CORS for API calls and — once a cookie-based
# refresh token is ever enabled (ADR-0029) — no cross-site SameSite/CSRF
# complexity either.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream stormpulse_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2m;
        root /usr/share/nginx/html;
        index index.html;

        # The one trusted proxy hop the backend's rate limiter is designed
        # for (ADR-0033) — X-Forwarded-For here is always exactly this
        # proxy's own view of the real client, never something the client
        # itself set.
        location /api/ {
            proxy_pass http://stormpulse_api;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location ~ ^/(health|ready|docs|redoc|openapi\.json)$ {
            proxy_pass http://stormpulse_api;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
        }

        # Single-page app — no client-side router in web/ today, but this
        # keeps a direct reload of any future non-root route working
        # instead of 404ing.
        #
        # Security headers (Fase 5, ADR-0046) live here and only here —
        # scoped to the SPA response, not /api/ or /health|docs|redoc|
        # openapi.json above. Those are proxied straight to FastAPI, which
        # already sets its own headers (backend/app/core/security_headers.py)
        # and deliberately skips CSP for /docs|/redoc so Swagger UI's own
        # inline scripts keep working (ADR-0007) — adding a second,
        # stricter CSP here on top of the proxy would fight that choice.
        location / {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://js.hcaptcha.com https://newassets.hcaptcha.com; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: https://tile.openstreetmap.org https://server.arcgisonline.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://accounts.google.com https://nominatim.openstreetmap.org https://tile.openstreetmap.org https://server.arcgisonline.com https://hcaptcha.com https://*.hcaptcha.com; worker-src 'self' blob:; child-src blob:; frame-src https://accounts.google.com https://newassets.hcaptcha.com https://*.hcaptcha.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            # index.html (served here for `/` and for every SPA-route
            # fallback) must always be revalidated — it's what names the
            # current content-hashed JS/CSS bundle. Without this, a browser
            # can hold onto a stale index.html via heuristic caching (no
            # explicit Cache-Control, so RFC 7234 lets it guess a freshness
            # lifetime from Last-Modified) and keep running old code for
            # hours after a deploy, since nothing in the SPA itself forces
            # a real page reload — a real incident, not a hypothetical one
            # (ADR-0052).
            add_header Cache-Control "no-cache" always;

            try_files $uri $uri/ /index.html;
        }

        # Vite's hashed filenames (index-<hash>.js, etc.) — the opposite
        # policy from `location /` above: these never change content under
        # the same URL, so cache them hard. This location's longer prefix
        # match takes priority over `location /` for anything under
        # /assets/, so it — not the no-cache header above — is what a
        # browser actually sees for these files.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }
}
