name: Deploy to production (EC2)

# Runs after "Publish Docker image" finishes successfully — deploying
# before the new images exist would just redeploy the old ones. Also
# triggerable manually (workflow_dispatch) for a redeploy without a new
# image (e.g. after editing docker-compose.prod.yml on the server-side
# repo checkout).
#
# Uses a dedicated deploy-only SSH key (EC2_SSH_KEY secret) — not anyone's
# personal key — so it can be rotated/revoked independently. Infra
# ADR-0037/0038/0039.
on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
    branches: [main, claude/stormpulse-project-5a5mij]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          script: |
            set -euo pipefail
            cd ~/StormPulse
            git pull --ff-only
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            # Migrations are designed to be safe to run unattended — tested
            # upgrade/downgrade end-to-end, frozen-DDL baseline (ADR-0031).
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api alembic upgrade head
            # Old image layers pile up on every deploy — real risk on a
            # t3.small's 30GB (free-tier) EBS volume.
            docker image prune -f
            curl -fsS http://localhost/health
