name: CI

# Hardening (ADR-0043): this single workflow now owns test → publish →
# deploy end to end, via `needs`. Before this, `docker-publish.yml` and
# `deploy-prod.yml` were separate workflows triggered independently off
# `push` / `workflow_run` — a commit that failed CI could still have its
# image built and published (build succeeding is not the same as tests
# passing), and that same published image would then deploy to
# production automatically. Putting everything in one workflow makes
# `needs` do the gating: publish/deploy jobs below literally cannot start
# unless every test job succeeded first, for this exact commit.
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  # PRs: cancel stale runs of the same PR (fast feedback, never deploys).
  # Pushes: queue instead of cancelling — a push landing while a previous
  # one's deploy job is mid-flight must never have that deploy yanked out
  # from under it; it waits its turn instead.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -----------------------------------------------------------------------
  # Backend: lint, typing and unit tests (no external services needed).
  # -----------------------------------------------------------------------
  backend:
    name: Backend (lint · typing · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real Postgres+PostGIS and Redis so integration tests (FASE 14) run for
    # real instead of being auto-skipped — see tests/conftest.py.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: stormpulse
          POSTGRES_PASSWORD: stormpulse
          POSTGRES_DB: stormpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only, high-ceiling rate limits: the real limits are already
      # covered in isolation by tests/test_ratelimit.py against a fake
      # Redis; a real shared Redis across many integration tests in a tight
      # loop would otherwise trip the production-sane limits and flake.
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      REDIS_HOST: localhost
      AUTH_RATE_LIMIT_MAX: "100000"
      DEFAULT_RATE_LIMIT_MAX: "100000"
      PUBLIC_RATE_LIMIT_MAX: "100000"
      POSTGRES_USER: stormpulse
      POSTGRES_PASSWORD: stormpulse
      POSTGRES_DB: stormpulse
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy app engine workers tests

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit

      - name: Apply migrations
        run: alembic upgrade head

      - name: Pytest (unit + integration, with coverage)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  # -----------------------------------------------------------------------
  # Root app: the original public-facing weather widget (published to
  # GitHub Pages by deploy.yml) — separate product from web/ (admin
  # dashboard) and mobile/. Not exercised anywhere else in CI until now.
  # -----------------------------------------------------------------------
  root:
    name: Root app (typecheck · build · audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: npm audit (runtime deps — blocking on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (incl. build tools — informational only)
        if: always()
        run: npm audit --audit-level=high || true

  # -----------------------------------------------------------------------
  # Web admin dashboard: type-check and production build.
  # -----------------------------------------------------------------------
  web:
    name: Web admin (typecheck · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Vitest (HTTP client/session renewal/formatting — Fase 10)
        run: npm test
      - run: npm run build
      - name: npm audit (runtime deps — blocking on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (incl. build tools — informational only)
        if: always()
        run: npm audit --audit-level=high || true

  # -----------------------------------------------------------------------
  # Mobile app (Expo / React Native): type-check.
  # -----------------------------------------------------------------------
  mobile:
    name: Mobile app (typecheck · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Jest (session/refresh-token flow — Fase 3)
        run: npm test -- --ci
      - name: npm audit (runtime deps — blocking on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (incl. build tools — informational only)
        if: always()
        run: npm audit --audit-level=high || true

  # -----------------------------------------------------------------------
  # Docker: build the image, boot the full stack and smoke-test the API
  # health/readiness endpoints against real Postgres+PostGIS and Redis.
  # -----------------------------------------------------------------------
  docker:
    name: Docker build & stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify env var passthrough (api/worker/beat get every Settings field)
        # Hardening: catches the class of bug where a variable is
        # documented in .env.example/Settings but never actually reaches
        # any container (TRUSTED_PROXY_IPS, REFRESH_COOKIE_*, OTEL_*,
        # INMET_*/CPTEC_*/OPEN_METEO_*/AGRO_*, SATELLITE_EXTENT were all
        # silently dropped before env_file replaced the old hand-enumerated
        # list). Writes its own throwaway sentinel .env, never touches
        # real secrets.
        run: python3 infra/verify_compose_env.py

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build images (runtime-base, the default variant)
        run: docker compose build

      - name: Build runtime-satellite variant (GDAL/TATHU — build-only)
        # Hardening ADR-0032: confirms the satellite-capable image still
        # builds (catches a broken GDAL/TATHU pin) without paying for a
        # second full stack boot + smoke-test cycle in CI.
        run: docker build --target runtime-satellite -t stormpulse-backend:satellite-check ./backend

      - name: Image size comparison (runtime-base vs runtime-satellite)
        run: |
          docker images stormpulse-api --format '{{.Repository}} (runtime-base)  {{.Size}}'
          docker images stormpulse-backend --format '{{.Repository}}:{{.Tag}} (runtime-satellite)  {{.Size}}'

      - name: Start db/redis
        # Same order as infra/deploy.sh: db/redis first, then migrate,
        # then api/worker/beat/web — required since RLS (ADR-0054,
        # migration 0b7b9a5dbd11) made the API/workers connect as a role
        # (`stormpulse_app`) that only exists *after* migrations run.
        # Starting api before that migration meant `/ready` could never
        # succeed (the role didn't exist yet) — caught by this exact job.
        run: docker compose up -d db redis

      - name: Run migrations (Alembic + PostGIS)
        run: docker compose run --rm api alembic upgrade head

      - name: Verify PostGIS and schema
        run: |
          docker compose exec -T db psql -U stormpulse -d stormpulse -c "SELECT postgis_version();"
          docker compose exec -T db psql -U stormpulse -d stormpulse -c "\dt" | grep -q storm_cells
          docker compose exec -T db psql -U stormpulse -d stormpulse -c "\dt" | grep -q locations

      - name: Start api/worker/beat/web
        run: docker compose up -d

      - name: Wait for API liveness (/health)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "API is live"; exit 0
            fi
            echo "waiting for API... ($i)"; sleep 2
          done
          echo "API did not become live in time"; exit 1

      - name: Assert /health returns ok
        run: |
          body="$(curl -fsS http://localhost:8000/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'

      - name: Wait for readiness (/ready → 200)
        run: |
          for i in $(seq 1 60); do
            code="$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:8000/ready)"
            if [ "$code" = "200" ]; then
              echo "API is ready"; cat /tmp/ready.json; exit 0
            fi
            echo "waiting for readiness (http $code)... ($i)"; sleep 2
          done
          echo "API did not become ready in time"; cat /tmp/ready.json || true; exit 1

      - name: Assert readiness checks are all ok
        run: |
          cat /tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json
          grep -q '"database":"ok"' /tmp/ready.json
          grep -q '"redis":"ok"' /tmp/ready.json

      - name: Integration — register, login, /users/me (FASE 3)
        run: |
          set -e
          base=http://localhost:8000/api/v1
          email="ci-$RANDOM@example.com"
          # register
          curl -fsS -X POST "$base/auth/register" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"supersecret123\",\"full_name\":\"CI\"}" \
            | tee /tmp/reg.json
          grep -q "\"email\":\"$email\"" /tmp/reg.json
          # login
          curl -fsS -X POST "$base/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"supersecret123\"}" | tee /tmp/tok.json
          access="$(python3 -c 'import json;print(json.load(open("/tmp/tok.json"))["access_token"])')"
          test -n "$access"
          # /users/me with the token
          curl -fsS "$base/users/me" -H "Authorization: Bearer $access" | tee /tmp/me.json
          grep -q "\"email\":\"$email\"" /tmp/me.json
          # unauthenticated /users/me must be 401
          code="$(curl -s -o /dev/null -w '%{http_code}' "$base/users/me")"
          test "$code" = "401"
          echo "auth flow OK"

      - name: Integration — location CRUD + PostGIS nearby (FASE 4)
        run: |
          set -e
          base=http://localhost:8000/api/v1
          email="ci-loc-$RANDOM@example.com"
          curl -fsS -X POST "$base/auth/register" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"supersecret123\"}" > /dev/null
          access="$(curl -fsS -X POST "$base/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"supersecret123\"}" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')"
          auth="Authorization: Bearer $access"
          # create a monitored location (Casa) with geom populated from lat/lon
          curl -fsS -X POST "$base/locations" -H "$auth" -H 'Content-Type: application/json' \
            -d '{"name":"Casa","kind":"home","latitude":-23.55,"longitude":-46.63,"radius_km":50,
                 "alert_preferences":[{"alert_type":"hail","enabled":true}]}' | tee /tmp/loc.json
          loc_id="$(python3 -c 'import json;print(json.load(open("/tmp/loc.json"))["id"])')"
          # list + fetch
          curl -fsS "$base/locations" -H "$auth" | grep -q "$loc_id"
          # PostGIS proximity query runs (empty until FASE 6 populates cells)
          curl -fsS "$base/storms/nearby?lat=-23.55&lon=-46.63&radius_km=50" -H "$auth" | tee /tmp/near.json
          test "$(cat /tmp/near.json)" = "[]"
          # no risk yet → 404 (honest: engine not built)
          code="$(curl -s -o /dev/null -w '%{http_code}' "$base/locations/$loc_id/risk" -H "$auth")"
          test "$code" = "404"
          echo "locations + PostGIS OK"

      - name: Integration — worker pipeline materializes storms + risk (FASE 10)
        run: |
          set -e
          base=http://localhost:8000/api/v1
          email="ci-pipe-$RANDOM@example.com"
          curl -fsS -X POST "$base/auth/register" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"supersecret123\"}" > /dev/null
          access="$(curl -fsS -X POST "$base/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"supersecret123\"}" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')"
          auth="Authorization: Bearer $access"
          # location under the mock storm footprint (~ -23.5,-46.6)
          curl -fsS -X POST "$base/locations" -H "$auth" -H 'Content-Type: application/json' \
            -d '{"name":"Casa","kind":"home","latitude":-23.5,"longitude":-46.6,"radius_km":80}' \
            | tee /tmp/ploc.json
          loc_id="$(python3 -c 'import json;print(json.load(open("/tmp/ploc.json"))["id"])')"
          # run ONE ingestion cycle (provider→engine→risk→alert) in a one-off
          # container (-T: no TTY in CI). Fail loudly with stderr on error.
          docker compose run --rm -T api python -m workers.run_once > /tmp/cycle.json 2> /tmp/cycle.err \
            || { echo "run_once failed:"; cat /tmp/cycle.err; exit 1; }
          cat /tmp/cycle.json
          python3 -c 'import json; s=json.load(open("/tmp/cycle.json")); assert s["cells"]>=1, s; assert s["risks"]>=1, s'
          # storms are now materialized and queryable
          curl -fsS "$base/storms" -H "$auth" | tee /tmp/storms.json
          python3 -c 'import json; assert len(json.load(open("/tmp/storms.json")))>=1'
          # nearby query returns the cell
          curl -fsS "$base/storms/nearby?lat=-23.5&lon=-46.6&radius_km=80" -H "$auth" | tee /tmp/pnear.json
          python3 -c 'import json; assert len(json.load(open("/tmp/pnear.json")))>=1'
          # the location now has a risk assessment (was 404 before the cycle)
          curl -fsS "$base/locations/$loc_id/risk" -H "$auth" | tee /tmp/prisk.json
          python3 -c 'import json; r=json.load(open("/tmp/prisk.json")); assert r["is_mock"] is True and r["experimental"] is True, r'
          echo "worker pipeline OK"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # -----------------------------------------------------------------------
  # Publish: only reachable once every test job above has succeeded.
  # Build-only (no push) on PRs — still catches a broken Dockerfile early
  # without ever putting an unreviewed image in the registry.
  # -----------------------------------------------------------------------
  publish-backend:
    name: Publish backend image
    needs: [backend, root, web, mobile, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Hardening ADR-0032: two published variants. "runtime-base" (no
      # GDAL/TATHU, matches the project's SATELLITE_ENABLED=false default)
      # is untagged/plain — the variant most deployments want. "satellite"
      # gets a "-satellite" tag suffix and maps to the runtime-satellite
      # Docker stage.
      matrix:
        include:
          - target: runtime-base
            suffix: ""
          - target: runtime-satellite
            suffix: "-satellite"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on non-PR events)
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  publish-web:
    name: Publish web image
    needs: [backend, root, web, mobile, docker]
    # Dashboard SPA + nginx reverse proxy (infra ADR-0038) — separate image,
    # separate repository name (`stormpulse-web`), same-origin deploy: this
    # image's own nginx serves the built SPA and proxies /api/* etc. to the
    # `api` service (see docker-compose.prod.yml).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on non-PR events)
        uses: docker/build-push-action@v7
        with:
          context: web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # -----------------------------------------------------------------------
  # Deploy: only reachable once both publish jobs succeeded (which in turn
  # required every test job to succeed) — never on a PR, never on a commit
  # whose tests didn't pass, and always the exact SHA `github.sha` refers
  # to in this same run (no race with a later push landing in between).
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy to production (EC2)
    needs: [publish-backend, publish-web]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/stormpulse-project-5a5mij')
    runs-on: ubuntu-latest
    environment: production
    # Separate from the workflow-level group above — this one has no
    # cancel-in-progress at all, at any event type: two deploys must never
    # run concurrently against the same server, they queue.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Compute this commit's immutable image tag
        id: image
        run: echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH (pinned to this commit's published images)
        # The actual sequencing (Postgres/Redis health -> pre-deploy
        # backup -> one-shot migration -> app tier -> /ready -> smoke test
        # -> rollback on any failure) lives in infra/deploy.sh, versioned
        # and reviewable like any other script — not inlined here. Fase 3,
        # ADR-0044.
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 10m
          envs: IMAGE_TAG,COMMIT_SHA
          script: |
            set -euo pipefail
            cd ~/StormPulse
            echo "Deploying commit $COMMIT_SHA (images tagged $IMAGE_TAG)"
            git fetch origin
            git checkout "$COMMIT_SHA"

            export STORMPULSE_IMAGE="ghcr.io/felipeaugusantos/stormpulse:${IMAGE_TAG}"
            export STORMPULSE_WEB_IMAGE="ghcr.io/felipeaugusantos/stormpulse-web:${IMAGE_TAG}"
            # Preserve this server's satellite-mode choice (ADR-0041) if
            # already set — re-pin it to this exact commit's satellite
            # image instead of leaving it on whatever floating tag it had.
            if grep -q '^STORMPULSE_WORKER_IMAGE=.*-satellite' .env 2>/dev/null; then
              export STORMPULSE_WORKER_IMAGE="ghcr.io/felipeaugusantos/stormpulse:${IMAGE_TAG}-satellite"
            fi

            chmod +x infra/deploy.sh
            ./infra/deploy.sh
