name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Backend: lint, typing and unit tests (no external services needed).
  # -----------------------------------------------------------------------
  backend:
    name: Backend (lint · typing · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real Postgres+PostGIS and Redis so integration tests (FASE 14) run for
    # real instead of being auto-skipped — see tests/conftest.py.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: stormpulse
          POSTGRES_PASSWORD: stormpulse
          POSTGRES_DB: stormpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only, high-ceiling rate limits: the real limits are already
      # covered in isolation by tests/test_ratelimit.py against a fake
      # Redis; a real shared Redis across many integration tests in a tight
      # loop would otherwise trip the production-sane limits and flake.
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      REDIS_HOST: localhost
      AUTH_RATE_LIMIT_MAX: "100000"
      DEFAULT_RATE_LIMIT_MAX: "100000"
      PUBLIC_RATE_LIMIT_MAX: "100000"
      POSTGRES_USER: stormpulse
      POSTGRES_PASSWORD: stormpulse
      POSTGRES_DB: stormpulse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy app engine workers tests

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit

      - name: Apply migrations
        run: alembic upgrade head

      - name: Pytest (unit + integration, with coverage)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  # -----------------------------------------------------------------------
  # Web admin dashboard: type-check and production build.
  # -----------------------------------------------------------------------
  web:
    name: Web admin (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # -----------------------------------------------------------------------
  # Mobile app (Expo / React Native): type-check.
  # -----------------------------------------------------------------------
  mobile:
    name: Mobile app (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # -----------------------------------------------------------------------
  # Docker: build the image, boot the full stack and smoke-test the API
  # health/readiness endpoints against real Postgres+PostGIS and Redis.
  # -----------------------------------------------------------------------
  docker:
    name: Docker build & stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for API liveness (/health)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "API is live"; exit 0
            fi
            echo "waiting for API... ($i)"; sleep 2
          done
          echo "API did not become live in time"; exit 1

      - name: Assert /health returns ok
        run: |
          body="$(curl -fsS http://localhost:8000/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'

      - name: Wait for readiness (/ready → 200)
        run: |
          for i in $(seq 1 60); do
            code="$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:8000/ready)"
            if [ "$code" = "200" ]; then
              echo "API is ready"; cat /tmp/ready.json; exit 0
            fi
            echo "waiting for readiness (http $code)... ($i)"; sleep 2
          done
          echo "API did not become ready in time"; cat /tmp/ready.json || true; exit 1

      - name: Assert readiness checks are all ok
        run: |
          cat /tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json
          grep -q '"database":"ok"' /tmp/ready.json
          grep -q '"redis":"ok"' /tmp/ready.json

      - name: Run migrations (Alembic + PostGIS)
        run: docker compose exec -T api alembic upgrade head

      - name: Verify PostGIS and schema
        run: |
          docker compose exec -T db psql -U stormpulse -d stormpulse -c "SELECT postgis_version();"
          docker compose exec -T db psql -U stormpulse -d stormpulse -c "\dt" | grep -q storm_cells
          docker compose exec -T db psql -U stormpulse -d stormpulse -c "\dt" | grep -q locations

      - name: Integration — register, login, /users/me (FASE 3)
        run: |
          set -e
          base=http://localhost:8000/api/v1
          email="ci-$RANDOM@example.com"
          # register
          curl -fsS -X POST "$base/auth/register" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"supersecret123\",\"full_name\":\"CI\"}" \
            | tee /tmp/reg.json
          grep -q "\"email\":\"$email\"" /tmp/reg.json
          # login
          curl -fsS -X POST "$base/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"supersecret123\"}" | tee /tmp/tok.json
          access="$(python3 -c 'import json;print(json.load(open("/tmp/tok.json"))["access_token"])')"
          test -n "$access"
          # /users/me with the token
          curl -fsS "$base/users/me" -H "Authorization: Bearer $access" | tee /tmp/me.json
          grep -q "\"email\":\"$email\"" /tmp/me.json
          # unauthenticated /users/me must be 401
          code="$(curl -s -o /dev/null -w '%{http_code}' "$base/users/me")"
          test "$code" = "401"
          echo "auth flow OK"

      - name: Integration — location CRUD + PostGIS nearby (FASE 4)
        run: |
          set -e
          base=http://localhost:8000/api/v1
          email="ci-loc-$RANDOM@example.com"
          curl -fsS -X POST "$base/auth/register" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"supersecret123\"}" > /dev/null
          access="$(curl -fsS -X POST "$base/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"supersecret123\"}" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')"
          auth="Authorization: Bearer $access"
          # create a monitored location (Casa) with geom populated from lat/lon
          curl -fsS -X POST "$base/locations" -H "$auth" -H 'Content-Type: application/json' \
            -d '{"name":"Casa","kind":"home","latitude":-23.55,"longitude":-46.63,"radius_km":50,
                 "alert_preferences":[{"alert_type":"hail","enabled":true}]}' | tee /tmp/loc.json
          loc_id="$(python3 -c 'import json;print(json.load(open("/tmp/loc.json"))["id"])')"
          # list + fetch
          curl -fsS "$base/locations" -H "$auth" | grep -q "$loc_id"
          # PostGIS proximity query runs (empty until FASE 6 populates cells)
          curl -fsS "$base/storms/nearby?lat=-23.55&lon=-46.63&radius_km=50" -H "$auth" | tee /tmp/near.json
          test "$(cat /tmp/near.json)" = "[]"
          # no risk yet → 404 (honest: engine not built)
          code="$(curl -s -o /dev/null -w '%{http_code}' "$base/locations/$loc_id/risk" -H "$auth")"
          test "$code" = "404"
          echo "locations + PostGIS OK"

      - name: Integration — worker pipeline materializes storms + risk (FASE 10)
        run: |
          set -e
          base=http://localhost:8000/api/v1
          email="ci-pipe-$RANDOM@example.com"
          curl -fsS -X POST "$base/auth/register" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"supersecret123\"}" > /dev/null
          access="$(curl -fsS -X POST "$base/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"supersecret123\"}" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')"
          auth="Authorization: Bearer $access"
          # location under the mock storm footprint (~ -23.5,-46.6)
          curl -fsS -X POST "$base/locations" -H "$auth" -H 'Content-Type: application/json' \
            -d '{"name":"Casa","kind":"home","latitude":-23.5,"longitude":-46.6,"radius_km":80}' \
            | tee /tmp/ploc.json
          loc_id="$(python3 -c 'import json;print(json.load(open("/tmp/ploc.json"))["id"])')"
          # run ONE ingestion cycle (provider→engine→risk→alert) in a one-off
          # container (-T: no TTY in CI). Fail loudly with stderr on error.
          docker compose run --rm -T api python -m workers.run_once > /tmp/cycle.json 2> /tmp/cycle.err \
            || { echo "run_once failed:"; cat /tmp/cycle.err; exit 1; }
          cat /tmp/cycle.json
          python3 -c 'import json; s=json.load(open("/tmp/cycle.json")); assert s["cells"]>=1, s; assert s["risks"]>=1, s'
          # storms are now materialized and queryable
          curl -fsS "$base/storms" -H "$auth" | tee /tmp/storms.json
          python3 -c 'import json; assert len(json.load(open("/tmp/storms.json")))>=1'
          # nearby query returns the cell
          curl -fsS "$base/storms/nearby?lat=-23.5&lon=-46.6&radius_km=80" -H "$auth" | tee /tmp/pnear.json
          python3 -c 'import json; assert len(json.load(open("/tmp/pnear.json")))>=1'
          # the location now has a risk assessment (was 404 before the cycle)
          curl -fsS "$base/locations/$loc_id/risk" -H "$auth" | tee /tmp/prisk.json
          python3 -c 'import json; r=json.load(open("/tmp/prisk.json")); assert r["is_mock"] is True and r["experimental"] is True, r'
          echo "worker pipeline OK"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
