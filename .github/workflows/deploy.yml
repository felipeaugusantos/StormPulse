name: Deploy to GitHub Pages

on:
  push:
    # TODO(owner): o repositório ainda não tem uma branch `main` — a branch
    # padrão atual é `claude/stormpulse-project-5a5mij`. Listamos as duas
    # aqui para que o deploy funcione hoje e continue funcionando sem
    # edição adicional se/quando a branch padrão for renomeada para `main`
    # (recomendado; ver ARCHITECTURE.md § Branch principal). Depois da
    # renomeação, remova o nome antigo desta lista.
    branches: [main, claude/stormpulse-project-5a5mij]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
