[project]
name = "stormpulse-backend"
version = "0.1.0"
description = "StormPulse — plataforma de monitoramento meteorológico acionável (backend)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "geoalchemy2>=0.15",
    "alembic>=1.14",
    "redis>=5.2",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "celery>=5.4",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "google-auth>=2.35",
    "pywebpush>=2.0",
    "cryptography>=43.0",
    "boto3>=1.35",
]

[project.optional-dependencies]
# GDAL/TATHU need matching system libgdal headers to even install — kept out
# of the main dependency list so a plain dev venv (this one included) isn't
# forced to have GDAL. The Docker image installs this extra explicitly,
# after apt-get installs the matching system GDAL. See Dockerfile and
# workers/satellite_pipeline.py.
#
# TATHU isn't on PyPI (INPE ships it for conda/mamba only, see its
# INSTALL.rst) — installed from GitHub directly in the Dockerfile
# (--no-deps) with its real runtime deps listed here individually, derived
# from its env.yml minus plotting/docs-only packages we never call
# (cartopy, geopandas, sphinx*, tqdm).
satellite = [
    "aenum",
    "affine",
    "netCDF4",
    "opencv-python-headless",
    "pathos",
    "pillow",
    "pyproj",
    "rasterstats",
    "rtree",
    "scikit-image",
    "scipy",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "engine*", "workers*"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "engine", "workers", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "B008",  # function-call-in-default-argument (FastAPI Depends idiom)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "engine", "workers"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts allowed in tests

# ---------------------------------------------------------------------------
# mypy (typing)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "geoalchemy2.*", "celery.*", "opentelemetry.instrumentation.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-auth ships without inline types/py.typed for these submodules.
module = ["google.oauth2.*", "google.auth.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# GDAL/TATHU: C-extension bindings with no type stubs, and not installed at
# all outside the Docker image (see workers/satellite_pipeline.py docstring).
module = ["osgeo.*", "tathu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy/Pillow: not installed outside the Docker image (satellite extra),
# same as osgeo/tathu above.
module = ["numpy.*", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's task decorator is untyped; allow it in the tasks module only.
module = ["workers.tasks"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# pywebpush ships without inline types/py.typed.
module = ["pywebpush.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# boto3/botocore ship without inline types/py.typed (full typing needs the
# optional boto3-stubs/botocore-stubs packages, not worth the extra
# dependency for the single `ses.send_email` call this project makes).
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: needs a real Postgres+PostGIS and Redis (auto-skipped when unavailable)",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app", "engine", "workers"]
# NOT branch coverage — confirmed live (not assumed) that coverage.py's
# branch counting is bytecode-sensitive across Python versions: the exact
# same test run, same code, same --cov-fail-under=85, measured 90%+ on
# Python 3.14 (a contributor's local install) but only ~84% inside the
# real python:3.12-slim image CI actually uses — a 6-point swing from the
# interpreter alone, no code or test change, reproduced by running the
# identical command inside a container built from CI's own pinned base
# image. Plain statement coverage doesn't have this instability (85.8%+
# under the same Python 3.12 run) and is what's actually enforced in CI —
# see ADR-0061.
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
