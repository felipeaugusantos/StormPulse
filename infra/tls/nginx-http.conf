# StormPulse — Fase 1 (HTTP-only, sem certificado ainda). Serve o
# desafio ACME do Let's Encrypt (/.well-known/acme-challenge/) além do
# app normal — o site continua funcionando em HTTP durante a emissão do
# certificado. Trocado pela config HTTPS (nginx-https.conf) por
# infra/setup-tls.sh depois que o certificado for emitido.
#
# Idêntico ao web/nginx.conf (mesma origem, proxy pra API), só adiciona
# o location do desafio ACME.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream stormpulse_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2m;
        root /usr/share/nginx/html;
        index index.html;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            proxy_pass http://stormpulse_api;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location ~ ^/(health|ready|docs|redoc|openapi\.json)$ {
            proxy_pass http://stormpulse_api;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
