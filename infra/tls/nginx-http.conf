# StormPulse — Fase 1 (HTTP-only, sem certificado ainda). Serve o
# desafio ACME do Let's Encrypt (/.well-known/acme-challenge/) além do
# app normal — o site continua funcionando em HTTP durante a emissão do
# certificado. Trocado pela config HTTPS (nginx-https.conf) por
# infra/setup-tls.sh depois que o certificado for emitido.
#
# Idêntico ao web/nginx.conf (mesma origem, proxy pra API), só adiciona
# o location do desafio ACME.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream stormpulse_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2m;
        root /usr/share/nginx/html;
        index index.html;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            proxy_pass http://stormpulse_api;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location ~ ^/(health|ready|docs|redoc|openapi\.json)$ {
            proxy_pass http://stormpulse_api;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
        }

        # Security headers (Fase 5, ADR-0046) — scoped to the SPA response
        # only, not /api/ or /health|docs|redoc|openapi.json above (those
        # already get their own headers from FastAPI, which deliberately
        # skips CSP on /docs|/redoc so Swagger UI keeps working, ADR-0007).
        # No Strict-Transport-Security here — no certificate yet on this
        # HTTP-only variant (nginx-https.conf adds it once TLS is live).
        location / {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org https://server.arcgisonline.com https://accounts.google.com; font-src 'self'; connect-src 'self' https://accounts.google.com https://nominatim.openstreetmap.org https://tile.openstreetmap.org https://server.arcgisonline.com; worker-src 'self' blob:; child-src blob:; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            # index.html must always be revalidated — see web/nginx.conf's
            # comment (ADR-0052) for the incident this fixes.
            add_header Cache-Control "no-cache" always;

            try_files $uri $uri/ /index.html;
        }

        # Vite's hashed filenames never change content under the same URL
        # — cache them hard. Longer prefix match wins over `location /`.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }
}
