# StormPulse — Fase 2 (HTTPS ativo). Ativado por infra/setup-tls.sh depois
# que o certificado Let's Encrypt já existe — `DOMAIN_PLACEHOLDER` é
# substituído pelo domínio real (ex.: 100-48-193-126.nip.io) pelo script,
# nunca editado manualmente aqui.
#
# Porta 80 continua aberta só pro desafio ACME (renovação) e pra
# redirecionar todo o resto pra HTTPS.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream stormpulse_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name DOMAIN_PLACEHOLDER;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name DOMAIN_PLACEHOLDER;

        ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 2m;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://stormpulse_api;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location ~ ^/(health|ready|docs|redoc|openapi\.json)$ {
            proxy_pass http://stormpulse_api;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
