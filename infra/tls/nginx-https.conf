# StormPulse — Fase 2 (HTTPS ativo). Ativado por infra/setup-tls.sh depois
# que o certificado Let's Encrypt já existe.
#
# Dois hosts, mesmo container, mesmo certificado multi-SAN (ADR-0079):
# STORMPULSE_DOMAIN_PLACEHOLDER (ex.: stormpulse.enzova.com.br) serve a
# SPA + proxy pra API; ENZOVA_DOMAINS_PLACEHOLDER (apex + www, ex.:
# "enzova.com.br www.enzova.com.br") serve o site institucional estático,
# sem proxy nenhum. CERT_DOMAIN_PLACEHOLDER é o domínio primário passado
# ao certbot (nome do diretório em /etc/letsencrypt/live/). Todos os
# placeholders são substituídos por infra/setup-tls.sh, nunca editados
# manualmente aqui.
#
# Porta 80 continua aberta só pro desafio ACME (renovação) e pra
# redirecionar todo o resto pra HTTPS.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream stormpulse_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name STORMPULSE_DOMAIN_PLACEHOLDER ENZOVA_DOMAINS_PLACEHOLDER;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name STORMPULSE_DOMAIN_PLACEHOLDER;

        ssl_certificate     /etc/letsencrypt/live/CERT_DOMAIN_PLACEHOLDER/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/CERT_DOMAIN_PLACEHOLDER/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 2m;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://stormpulse_api;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location ~ ^/(health|ready|docs|redoc|openapi\.json)$ {
            proxy_pass http://stormpulse_api;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
        }

        # Security headers (Fase 5, ADR-0046) — scoped to the SPA response
        # only, not /api/ or /health|docs|redoc|openapi.json above (those
        # already get their own headers from FastAPI, which deliberately
        # skips CSP on /docs|/redoc so Swagger UI keeps working, ADR-0007).
        #
        # A subtlety that bit us on first deploy: nginx's `add_header` is
        # NOT inherited from `server` into a `location` that defines its
        # own `add_header`s — the location's set silently replaces the
        # server's instead of merging with it. Strict-Transport-Security
        # was originally set at the server level and vanished from every
        # response served by this very location as a result. It has to be
        # listed here explicitly, alongside the rest.
        location / {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://js.hcaptcha.com https://newassets.hcaptcha.com; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: https://tile.openstreetmap.org https://server.arcgisonline.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://accounts.google.com https://nominatim.openstreetmap.org https://tile.openstreetmap.org https://server.arcgisonline.com https://hcaptcha.com https://*.hcaptcha.com; worker-src 'self' blob:; child-src blob:; frame-src https://accounts.google.com https://newassets.hcaptcha.com https://*.hcaptcha.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            # index.html must always be revalidated — see web/nginx.conf's
            # comment (ADR-0052) for the incident this fixes.
            add_header Cache-Control "no-cache" always;

            try_files $uri $uri/ /index.html;
        }

        # Vite's hashed filenames never change content under the same URL
        # — cache them hard. Longer prefix match wins over `location /`.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    server {
        listen 443 ssl;
        server_name ENZOVA_DOMAINS_PLACEHOLDER;

        ssl_certificate     /etc/letsencrypt/live/CERT_DOMAIN_PLACEHOLDER/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/CERT_DOMAIN_PLACEHOLDER/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/enzova-site;
        index index.html;

        # Site institucional — puramente estático, sem proxy pra API.
        # CSP mais restrita que a da SPA: não precisa de hCaptcha, Google
        # Sign-In nem tiles de mapa.
        location / {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

            try_files $uri $uri/ =404;
        }
    }
}
