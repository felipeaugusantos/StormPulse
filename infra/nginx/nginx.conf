# StormPulse — reverse proxy in front of the API (hardening: infra de
# produção). Plain HTTP for now (no domain/TLS yet — see infra/README.md
# "Adicionando TLS depois" for the upgrade path once a domain exists).
#
# This is the one trusted proxy hop the backend's rate limiter is designed
# for (ADR-0033) — its fixed IP (172.28.0.10, set in docker-compose.prod.yml)
# is exactly what TRUSTED_PROXY_IPS in the server's .env must be set to.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;

    # StormPulse's own security headers (app/core/security_headers.py)
    # already cover the API's JSON responses — nginx only adds what's
    # specific to being a reverse proxy, not duplicated app-level policy.

    upstream stormpulse_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2m;

        location / {
            proxy_pass http://stormpulse_api;
            proxy_http_version 1.1;

            # The one hop the backend is configured to trust (ADR-0033) —
            # X-Forwarded-For here is always exactly this proxy's own view
            # of the real client, never something the client itself set:
            # nginx overwrites it, it doesn't append to whatever the client
            # sent.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
