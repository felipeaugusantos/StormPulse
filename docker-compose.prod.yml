# StormPulse — production override (hardening: infra de produção).
#
# Usage on the server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the dev compose file:
# - Pulls the pre-built image from GHCR (docker-publish.yml) instead of
#   building locally — a t3.small has no spare RAM/CPU to build the
#   satellite variant, and there's no reason to rebuild what CI already
#   built and tested.
# - Postgres/Redis ports are NOT published to the host at all (dev exposes
#   them for local `psql`/`redis-cli` access; production has no reason to
#   reach them from outside the Docker network, and every published port
#   is a port a misconfigured security group could accidentally expose).
# - nginx fronts the API on port 80, at a fixed, known internal IP
#   (172.28.0.10) — that fixed IP is exactly what TRUSTED_PROXY_IPS in the
#   server's .env should be set to (see .env.example). Nothing else can
#   present as that IP: it only exists inside this Docker network, and TCP
#   source IPs can't be spoofed across a real connection.
# - `restart: unless-stopped` everywhere — survives an EC2 reboot without
#   needing a systemd unit.
# - Log rotation on every service — the default `json-file` driver has no
#   limit at all otherwise, and a t3.small's 30GB (free-tier) EBS volume
#   filling up with logs is a real way to take the whole box down.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    ports: !reset []
    restart: unless-stopped
    logging: *default-logging
    networks:
      - stormpulse

  redis:
    ports: !reset []
    restart: unless-stopped
    logging: *default-logging
    networks:
      - stormpulse

  api:
    build: !reset null
    image: ${STORMPULSE_IMAGE:-ghcr.io/felipeaugusantos/stormpulse:latest}
    ports: !reset []
    restart: unless-stopped
    logging: *default-logging
    networks:
      - stormpulse

  worker:
    build: !reset null
    image: ${STORMPULSE_IMAGE:-ghcr.io/felipeaugusantos/stormpulse:latest}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - stormpulse

  beat:
    build: !reset null
    image: ${STORMPULSE_IMAGE:-ghcr.io/felipeaugusantos/stormpulse:latest}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - stormpulse

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      stormpulse:
        ipv4_address: 172.28.0.10

networks:
  stormpulse:
    ipam:
      config:
        - subnet: 172.28.0.0/24
