# StormPulse — production override (hardening: infra de produção).
#
# Usage on the server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the dev compose file:
# - Pulls the pre-built image from GHCR (ci.yml's publish-backend/
#   publish-web jobs, hardening ADR-0043) instead of
#   building locally — a t3.small has no spare RAM/CPU to build the
#   satellite variant, and there's no reason to rebuild what CI already
#   built and tested.
# - Postgres/Redis ports are NOT published to the host at all (dev exposes
#   them for local `psql`/`redis-cli` access; production has no reason to
#   reach them from outside the Docker network, and every published port
#   is a port a misconfigured security group could accidentally expose).
# - `web` (built from web/Dockerfile, published as stormpulse-web —
#   infra ADR-0038) serves the dashboard SPA and reverse-proxies API calls
#   to `api`, both on port 80, at a fixed, known internal IP (172.28.0.10)
#   — that fixed IP is exactly what TRUSTED_PROXY_IPS in the server's .env
#   should be set to (see .env.example). Nothing else can present as that
#   IP: it only exists inside this Docker network, and TCP source IPs
#   can't be spoofed across a real connection.
# - `restart: unless-stopped` everywhere — survives an EC2 reboot without
#   needing a systemd unit.
# - Log rotation on every service — the default `json-file` driver has no
#   limit at all otherwise, and a t3.small's 30GB (free-tier) EBS volume
#   filling up with logs is a real way to take the whole box down.
# - `web`'s nginx.conf is mounted from infra/tls/nginx.conf.active (NOT
#   baked into the image) instead of the image's own default — this file
#   is what infra/setup-tls.sh switches between the HTTP-only and HTTPS
#   configs once a Let's Encrypt certificate exists (infra ADR-0039). It
#   must exist before the first `up` — bootstrap it with
#   `cp infra/tls/nginx-http.conf infra/tls/nginx.conf.active` (see
#   infra/README.md).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    ports: !reset []
    restart: unless-stopped
    logging: *default-logging
    networks:
      - stormpulse

  redis:
    ports: !reset []
    restart: unless-stopped
    logging: *default-logging
    networks:
      - stormpulse

  api:
    build: !reset null
    image: ${STORMPULSE_IMAGE:-ghcr.io/felipeaugusantos/stormpulse:latest}
    ports: !reset []
    restart: unless-stopped
    logging: *default-logging
    networks:
      - stormpulse

  worker:
    build: !reset null
    # Only `worker` ever imports GDAL/TATHU (workers/satellite_pipeline.py
    # — `api` only reads already-rendered results from the DB, see ADR-0041),
    # so it's the only service with its own image variable: set
    # STORMPULSE_WORKER_IMAGE to the `-satellite` tag when
    # SATELLITE_ENABLED=true, leave api/beat on the smaller runtime-base.
    image: ${STORMPULSE_WORKER_IMAGE:-${STORMPULSE_IMAGE:-ghcr.io/felipeaugusantos/stormpulse:latest}}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - stormpulse

  beat:
    build: !reset null
    image: ${STORMPULSE_IMAGE:-ghcr.io/felipeaugusantos/stormpulse:latest}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - stormpulse

  web:
    image: ${STORMPULSE_WEB_IMAGE:-ghcr.io/felipeaugusantos/stormpulse-web:latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    volumes:
      - ./infra/tls/nginx.conf.active:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      stormpulse:
        ipv4_address: 172.28.0.10

  # Not a long-running service — invoked via `docker compose run --rm
  # certbot ...` by infra/setup-tls.sh and infra/renew-tls.sh, never
  # started by a plain `up -d`.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - stormpulse

networks:
  stormpulse:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  certbot-etc:
  certbot-webroot:
